<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SweepTrack settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>body { width: auto; max-width: 480px; margin: 24px auto; } label { display: block; margin: 10px 0; }</style>
  </head>
  <body>
    <h2>SweepTrack extension</h2>
    <label>App URL <input id="apiBase" placeholder="https://app.sweeptrack.example" /></label>
    <label>API token <input id="token" placeholder="st_…" /></label>
    <p class="muted">Create a token in the web app under Settings → Browser extension.</p>
    <button id="save">Save & test</button>
    <div id="status" class="status"></div>
    <script src="options.js"></script>
  </body>
</html>
